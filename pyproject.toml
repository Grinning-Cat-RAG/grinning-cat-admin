[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "grinning-cat-admin"
version = "1.0.0"
description = "Python package for the Grinning Cat Admin UI"
authors = [
    {name = "Matteo Cacciola", email = "matteo.cacciola@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grinning-cat-python-sdk>=1.0.5",
    "msgpack>=1.2.1,<=2.0.0",
    "python-dotenv>=1.2.0,<=2.0.0",
    "python-slugify>=8.0.0,<=9.0.0",
    "requests>=2.34.0,<=3.0.0",
    "setuptools>=83.0.0,<=84.0.0",
    "streamlit>=1.62.0,<=2.0.0",
    "streamlit-js-eval>=1.0.0,<=2.0.0",
]

[project.urls]
Homepage = "https://github.com/matteocacciola/grinning-cat-admin"
Repository = "https://github.com/matteocacciola/grinning-cat-admin"
Issues = "https://github.com/matteocacciola/grinning-cat-admin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.15.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
